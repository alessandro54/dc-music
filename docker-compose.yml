# Standalone deployment — the whole stack on one box, no Dokku.
#
# Production runs on Dokku, where these three containers are wired by hand
# (see docs/DEPLOY.md). This file is the same topology in one place: useful for
# a fresh box, and as the executable record of how the sidecars are configured.
#
#   cp .env.example .env   # fill in BOT_TOKEN, CLIENT_ID, GUILD_ID, …
#   docker compose up -d
#
# Architecture and the measurements behind it: docs/ARCHITECTURE.md

name: music-bot

services:
  bot:
    # Built by CI on a native arm64 runner. Swap for `build: .` to build here.
    image: ghcr.io/alessandro54/discord-music:latest
    container_name: music-bot
    restart: unless-stopped
    depends_on:
      bgutil:
        condition: service_started
    environment:
      # Discord — the code logs in with BOT_TOKEN (not DISCORD_TOKEN).
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      CLIENT_ID: ${CLIENT_ID:?set CLIENT_ID in .env}
      GUILD_ID: ${GUILD_ID:?set GUILD_ID in .env}
      OWNER_ID: ${OWNER_ID:-}

      # Database. Turso if set, else SQLite at DB_URL (default ./bot.db).
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      DB_URL: ${DB_URL:-}

      # Spotify link resolution (optional).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}

      # Sidecars. Both are optional — unset either one and yt-dlp simply does
      # without it, more slowly or less reliably. See docs/ARCHITECTURE.md.
      YTDLP_POT_BASE_URL: http://bgutil:4416
      # YTDLP_PROXY is supported but deliberately unset: it exists for a CLEAN
      # egress (e.g. a static ISP proxy), which would let cookies be dropped on
      # the fast path. Cloudflare WARP used to fill this slot and is gone —
      # YouTube flags its whole pool now (verified 2026-08-27: login gates and
      # CDN 403s across three exits), so it bought ~8s of doomed attempt per
      # cold play and nothing else.
      # YTDLP_PROXY: ${YTDLP_PROXY:-}

      # Netscape format, full file contents. Required on a datacenter IP.
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-}

      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    volumes:
      # yt-dlp's player/signature cache. Without a real volume this is wiped on
      # every redeploy and each release starts cold.
      - ytdlp-cache:/data/ytdlp-cache

  # Mints PO tokens (BotGuard attestation). Cheap — ~13ms per token — and it is
  # what makes the no-cookie path reliable: 3/4 videos without it, 12/12 with.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: bgutil-provider
    restart: unless-stopped

volumes:
  ytdlp-cache:

# Both share compose's default network, so `bgutil` resolves by service name.
# On Dokku the equivalent is the `ytpot` network — see DEPLOY.md.
