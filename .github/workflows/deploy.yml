name: Build & Deploy to Dokku

on:
  workflow_dispatch:
  # Weekly rebuild keeps yt-dlp + the EJS solver current with YouTube changes
  # (cache-busted so pip actually re-pulls — see CACHEBUST below).
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - 'src/**/*.js'
      - 'deno.json'
      - 'deno.lock'
      - 'Dockerfile'
      - 'app.json'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/alessandro54/discord-music

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm   # native arm64 — no QEMU emulation
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write build info
        run: |
          echo "export const COMMIT = '${{ github.sha }}';" > src/lib/buildInfo.js

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Single-platform build, and nothing verifies the attestations. Left on,
          # buildx pushes an OCI index plus two untagged children (the arm64
          # manifest and the provenance blob) — three GHCR versions per build
          # instead of one, which is what let 40 builds become 120 versions.
          provenance: false
          sbom: false
          # Scheduled + manually dispatched runs bust the pip-install layer so
          # yt-dlp re-pulls fresh; pushes keep the cache for fast builds.
          build-args: |
            CACHEBUST=${{ github.event_name != 'push' && github.run_id || '' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.sha }}-r${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on Dokku
        uses: appleboy/ssh-action@v1
        with:
          host: 143.47.116.141
          username: ubuntu
          key: ${{ secrets.DOKKU_SSH_KEY }}
          # Per-run tag: scheduled rebuilds reuse the same commit SHA, and a
          # SHA-only tag makes Dokku skip the pull ("image exists on host") and
          # then fail with "No changes detected". A unique tag per run forces
          # both the pull and the redeploy.
          script: sudo dokku git:from-image music-bot ${{ env.IMAGE }}:${{ github.sha }}-r${{ github.run_id }}

  prune:
    # Weekly scheduled rebuilds push an image even in weeks with no commits, and
    # nothing ever deleted the old ones. Gated on `deploy` so a failed release
    # never prunes the versions it would roll back to.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # The package is linked to this repo, so GITHUB_TOKEN suffices — no PAT.
      # Deleting from GHCR can't disturb the live container: Dokku already
      # pulled the image to the host and runs from the local copy.
      - name: Keep only the 5 most recent image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: discord-music
          package-type: container
          min-versions-to-keep: 5
